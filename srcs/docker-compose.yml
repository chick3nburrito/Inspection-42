services:
  mariadb:
    image: inception-mariadb:bookworm
    build:
      context: ./requirements/mariadb
    env_file:
      - ./.env
    secrets:
      - db_root_password
      - db_password
    volumes:
      - /home/bamdjar/data/mariadb:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped

  wordpress:
    image: inception-wordpress:bookworm
    build:
      context: ./requirements/wordpress
    depends_on:
      - mariadb
    env_file:
      - ./.env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - /home/bamdjar/data/wordpress:/var/www/html
    networks:
      - inception
    restart: unless-stopped

  nginx:
    image: inception-nginx:bookworm
    build:
      context: ./requirements/nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - /home/bamdjar/data/wordpress:/var/www/html:ro
    networks:
      - inception
    restart: unless-stopped

networks:
  inception:
    driver: bridge

secrets:
  db_root_password:
    file: ../secrets/mysql_password.txt
  db_password:
    file: ../secrets/mysql_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
