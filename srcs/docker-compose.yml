services:
  mariadb:
    image: inception-mariadb:bookworm
    build:
      context: ./requirements/mariadb
    env_file:
      - ./.env
    secrets:
      - mysql_password
    volumes:
      - ${DATA_DIR:-/home/bamdjar/data}/mariadb:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mariadb -h 127.0.0.1 -u$$MYSQL_USER -p\"$$(cat /run/secrets/mysql_password)\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  wordpress:
    image: inception-wordpress:bookworm
    build:
      context: ./requirements/wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      WORDPRESS_DB_HOST: mariadb:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
    secrets:
      - mysql_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - ${DATA_DIR:-/home/bamdjar/data}/wordpress:/var/www/html
    networks:
      - inception
    restart: unless-stopped

  nginx:
    image: inception-nginx:bookworm
    build:
      context: ./requirements/nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - ${DATA_DIR:-/home/bamdjar/data}/wordpress:/var/www/html:ro
    networks:
      - inception
    restart: unless-stopped

networks:
  inception:
    driver: bridge

secrets:
  mysql_password:
    file: ./secrets/mysql_password.txt
  wp_admin_password:
    file: ./secrets/wp_admin_password.txt
  wp_user_password:
    file: ./secrets/wp_user_password.txt
